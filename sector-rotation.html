<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sector Rotation — SevenPercentCommunity</title>
<style>
:root{--bg:#090D13;--panel:#0F151D;--line:#2E4A68;--tx:#F3F6FA;--tx2:#A3ADBC;--tx3:#7C879A;--ice:#85B7EB;--cream:#F2EBDD}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px Arial,sans-serif}.wrap{max-width:1280px;margin:auto;padding:24px}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{color:var(--ice);font-size:12px;letter-spacing:.12em}.nav{display:flex;gap:15px;flex-wrap:wrap}.nav a{color:var(--tx2);text-decoration:none}.nav a:hover{color:var(--tx)}
.hero{padding:34px 0 20px}.hero h1{font:40px Georgia;color:var(--cream);margin:0 0 8px}.muted{color:var(--tx3)}.note{border:1px solid var(--line);background:var(--panel);padding:13px;margin:14px 0 20px;line-height:1.5;color:var(--tx2)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:1px solid var(--line);background:var(--panel);padding:16px}.head{display:flex;justify-content:space-between;gap:10px}.sector{font-size:18px;font-weight:bold}.phase{padding:5px 8px;border:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.leading{color:var(--ice)}.improving{color:#B8D2EE}.weakening{color:var(--cream)}.lagging{color:#7C879A}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.metric{background:#0A1119;padding:10px}.metric b{display:block;font-size:18px;margin-top:3px}.bar{height:6px;background:#1B2836;margin-top:12px}.bar i{display:block;height:100%;background:var(--ice)}.stocks{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}.stock{border:1px solid var(--line);padding:5px 7px;color:var(--tx2);text-decoration:none}.stock:hover{border-color:var(--ice);color:var(--tx)}.up{color:var(--ice)}.down{color:#7C879A}
@media(max-width:800px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.wrap{padding:16px}.hero h1{font-size:32px}}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand">SEVENPERCENTCOMMUNITY</div><nav class="nav">
<a href="./index.html">Screener</a><a href="./new-bullish.html">NEW Bullish</a><a href="./heatmap.html">Heatmap</a><a href="./backtest.html">Backtest</a><a href="./relative-strength.html">Relative Strength</a><a href="./ai-insights.html">Market Intelligence</a>
</nav></header>
<section class="hero"><h1>Sector Rotation</h1><div class="muted">Rotasi momentum teknikal di dalam universe KOMPAS100.</div></section>
<div id="note" class="note"></div><div id="grid" class="grid"></div>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const cls=s=>s.toLowerCase();
function render(d){
 document.getElementById('note').innerHTML='<b>Metodologi:</b> fase sektor dihitung dari rata-rata Technical Score relatif terhadap median seluruh sektor, lalu dikombinasikan dengan arah perubahan score harian. Breadth = % Bullish dikurangi % Bearish. Ini adalah <b>sector rotation berbasis teknikal KOMPAS100</b>, bukan indeks sektoral BEI.';
 document.getElementById('grid').innerHTML=d.sectors.map(s=>{
   const w=Math.max(0,Math.min(100,(s.avg_score+100)/2));
   const stocks=s.stocks.slice(0,8).map(x=>'<a class="stock" href="./index.html?stock='+encodeURIComponent(x.ticker)+'">'+esc(x.ticker)+' '+(x.score>=0?'+':'')+x.score.toFixed(1)+'</a>').join('');
   return '<article class="card"><div class="head"><div><div class="sector">'+esc(s.sector)+'</div><div class="muted">'+s.count+' saham</div></div><div class="phase '+cls(s.phase)+'">'+esc(s.phase)+'</div></div><div class="metrics"><div class="metric"><span class="muted">Avg Score</span><b>'+s.avg_score.toFixed(1)+'</b></div><div class="metric"><span class="muted">Δ Score</span><b class="'+(s.avg_score_delta>=0?'up':'down')+'">'+(s.avg_score_delta>=0?'+':'')+s.avg_score_delta.toFixed(1)+'</b></div><div class="metric"><span class="muted">Breadth</span><b>'+ (s.breadth>=0?'+':'')+s.breadth.toFixed(1)+'%</b></div><div class="metric"><span class="muted">Bullish</span><b>'+s.bullish+'/'+s.count+'</b></div></div><div class="bar"><i style="width:'+w+'%"></i></div><div class="muted" style="margin-top:10px">Top stocks by score</div><div class="stocks">'+stocks+'</div></article>';
 }).join('');
}
fetch('./data/sector-rotation.json?t='+Date.now()).then(r=>r.json()).then(render).catch(()=>document.getElementById('grid').innerHTML='<div class="muted">Data sector rotation belum tersedia.</div>');
</script></body></html>
