<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Heatmap — SevenPercentCommunity</title><style>:root{--bg:#090D13;--panel:#0F151D;--line:#2E4A68;--tx:#F3F6FA;--tx2:#A3ADBC;--tx3:#7C879A;--ice:#85B7EB;--cream:#F2EBDD}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px Arial,sans-serif}.wrap{max-width:1280px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{color:var(--ice);font-size:12px;letter-spacing:.12em}.nav a{color:var(--tx2);margin-left:15px;text-decoration:none}.hero{padding:34px 0 20px}.hero h1{font:40px Georgia;color:var(--cream);margin:0 0 8px}.muted{color:var(--tx3)}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:15px 0}.stat{border:1px solid var(--line);background:var(--panel);padding:14px}.v{font-size:26px;font-weight:bold}.heat{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.tile{border:1px solid var(--line);background:var(--panel);padding:13px;min-height:82px;text-decoration:none;color:var(--tx);display:flex;flex-direction:column;justify-content:space-between}.tile:hover{border-color:var(--ice)}.score{font-size:23px;font-weight:bold}.pos{color:var(--ice)}.neg{color:#7FA3CB}.neutral{color:var(--tx2)}.bar{height:5px;background:#1B2836;margin-top:9px}.bar i{display:block;height:100%;background:var(--ice)}.bar i.neg{background:#55789E}.legend{margin:15px 0;color:var(--tx2);font-size:12px}@media(max-width:900px){.heat{grid-template-columns:repeat(4,1fr)}}@media(max-width:650px){.heat{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:1fr 1fr}.wrap{padding:16px}}</style></head><body><div class="wrap"><header class="top"><div class="brand">SEVENPERCENTCOMMUNITY</div><nav><a href="./index.html">Screener</a><a href="./new-bullish.html">NEW Bullish</a><a href="./ai-insights.html">Market Intelligence</a><a href="./backtest.html">Backtest</a><a href="./sector-rotation.html">Sector Rotation</a></nav></header><section class="hero"><h1>Market Heatmap</h1><div class="muted">Peta momentum KOMPAS100 berdasarkan Technical Score.</div></section><div id="summary" class="summary"></div><div class="legend">Klik tile untuk membuka saham di screener. Heatmap ini berbasis technical score, bukan performa harga harian.</div><div id="heat" class="heat"></div></div><script>const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));async function load(){const d=await(await fetch('./data/signals.json?t='+Date.now())).json(),a=d.signals||[],c=f=>a.filter(f).length;document.getElementById('summary').innerHTML=[['Strong Bullish',c(x=>x.score>=60)],['Bullish',c(x=>x.score>=35&&x.score<60)],['Neutral',c(x=>x.score>-15&&x.score<35)],['Bearish',c(x=>x.score<=-15&&x.score>-60)],['Strong Bearish',c(x=>x.score<=-60)]].map(x=>'<div class="stat"><div class="muted">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>').join('');document.getElementById('heat').innerHTML=a.slice().sort((x,y)=>y.score-x.score).map(x=>{const s=+x.score,cl=s>=35?'pos':s<=-15?'neg':'neutral',w=Math.min(100,Math.abs(s));return '<a class="tile" href="./index.html?stock='+encodeURIComponent(x.ticker)+'"><div><b>'+esc(x.ticker)+'</b><div class="muted">'+esc(x.name)+'</div></div><div class="score '+cl+'">'+(s>0?'+':'')+esc(s.toFixed(1))+'</div><div class="muted">'+esc(x.signal)+' · '+esc(x.agree)+'/'+esc(x.total)+'</div><div class="bar"><i class="'+(s<0?'neg':'')+'" style="width:'+w+'%"></i></div></a>'}).join('')}load().catch(()=>document.getElementById('heat').innerHTML='<div class="muted">Data belum tersedia.</div>');</script></body></html>
