<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Heatmap — SevenPercentCommunity</title><style>:root{--bg:#090D13;--panel:#0F151D;--line:#2E4A68;--tx:#F3F6FA;--tx2:#A3ADBC;--tx3:#7C879A;--ice:#85B7EB;--cream:#F2EBDD}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px Arial,sans-serif}.wrap{max-width:1280px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{color:var(--ice);font-size:12px;letter-spacing:.12em}.nav a{color:var(--tx2);margin-left:15px;text-decoration:none}.hero{padding:34px 0 20px}.hero h1{font:40px Georgia;color:var(--cream);margin:0 0 8px}.muted{color:var(--tx3)}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:15px 0}.stat{border:1px solid var(--line);background:var(--panel);padding:14px}.v{font-size:26px;font-weight:bold}.heat{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.tile{position:relative;overflow:hidden;border:1px solid #34465B;background:linear-gradient(135deg,#182331,#101721);padding:14px;min-height:112px;border-radius:8px;text-decoration:none;color:var(--tx);display:flex;flex-direction:column;justify-content:space-between;gap:7px;box-shadow:0 4px 14px rgba(0,0,0,.16);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}.tile:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--tile-color,#8293A8)}.tile:after{content:"";position:absolute;width:110px;height:110px;right:-42px;top:-48px;border-radius:50%;background:var(--tile-glow,rgba(130,147,168,.12));pointer-events:none}.tile:hover{transform:translateY(-3px);border-color:var(--tile-color,#85B7EB);box-shadow:0 10px 26px rgba(0,0,0,.32)}.tile strong,.tile div{position:relative;z-index:1}.tile .muted{font-size:12px;line-height:1.35}.tile.bull-strong{--tile-color:#35F29A;--tile-glow:rgba(53,242,154,.20);background:linear-gradient(135deg,#123D30,#10241F)}.tile.bull{--tile-color:#20D6C7;--tile-glow:rgba(32,214,199,.18);background:linear-gradient(135deg,#123B40,#102329)}.tile.neutral-tile{--tile-color:#9BA8BA;--tile-glow:rgba(155,168,186,.12);background:linear-gradient(135deg,#273140,#171E29)}.tile.bear{--tile-color:#FFAA4C;--tile-glow:rgba(255,170,76,.18);background:linear-gradient(135deg,#452D1B,#241B16)}.tile.bear-strong{--tile-color:#FF5268;--tile-glow:rgba(255,82,104,.20);background:linear-gradient(135deg,#481D2A,#27151D)}.score{font-size:25px;font-weight:800;letter-spacing:-.03em}.pos{color:#70FFB9}.neg{color:#FFB36C}.neutral{color:#D0D7E2}.bar{height:5px;background:rgba(0,0,0,.3);margin-top:8px;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--tile-color,#85B7EB);border-radius:99px;box-shadow:0 0 10px var(--tile-glow,transparent)}.bar i.neg{background:#55789E}.legend{margin:15px 0;color:var(--tx2);font-size:12px}@media(max-width:900px){.heat{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:650px){.heat{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:11px;min-height:104px}.score{font-size:22px}.summary{grid-template-columns:1fr 1fr}.wrap{padding:16px}}<style id="compact-menu-style">
.menu-wrap{position:relative;display:flex;align-items:center;gap:12px;margin-left:auto}
.menu{position:relative}.menu summary{list-style:none;cursor:pointer;border:1px solid var(--line,#2E4A68);background:var(--panel2,#141C26);color:var(--tx,#F3F6FA);padding:8px 13px;border-radius:4px;font-size:13px;font-weight:600}
.menu summary::-webkit-details-marker{display:none}
.menu summary:hover{border-color:var(--ice,#85B7EB)}
.menu-panel{position:absolute;left:50%;right:auto;top:calc(100% + 8px);transform:translateX(-50%);z-index:1000;min-width:220px;padding:7px;border:1px solid var(--line,#2E4A68);background:var(--panel,#0F151D);box-shadow:0 14px 35px rgba(0,0,0,.35);border-radius:4px}
.menu-panel a{display:block!important;margin:0!important;padding:9px 11px;color:var(--tx2,#A3ADBC)!important;text-decoration:none!important;border-radius:3px;white-space:nowrap}
.menu-panel a:hover{background:var(--panel2,#141C26);color:var(--tx,#F3F6FA)!important}
@media(max-width:700px){.menu-panel{left:50%;right:auto;transform:translateX(-50%);min-width:210px}.menu summary{padding:8px 11px}}
</style></style><link rel="stylesheet" href="./ui.css">
</head><body><div class="wrap"><header class="top"><div class="brand">SEVENPERCENTCOMMUNITY</div><nav class="menu-wrap"><details class="menu"><summary>☰ Menu</summary><div class="menu-panel"><a href="./index.html">Screener</a><a href="./fundamental.html">Fundamental</a><a href="./teknikal.html">Technical</a><a href="./market-intelligence.html">Market Intelligence</a><a href="./recommendations.html">Recommendations</a><a href="./admin.html">Admin</a></div></details></nav></header><section class="hero"><h1>Market Heatmap</h1><div class="muted">Peta momentum KOMPAS100 berdasarkan Technical Score.</div></section><div id="summary" class="summary"></div><div class="legend">Klik tile untuk membuka saham di screener. Heatmap ini berbasis technical score, bukan performa harga harian.</div><div id="heat" class="heat"></div></div><script>const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));async function load(){const d=await(await fetch('./data/signals.json?t='+Date.now())).json(),a=d.signals||[],c=f=>a.filter(f).length;document.getElementById('summary').innerHTML=[['Strong Bullish',c(x=>x.score>=60)],['Bullish',c(x=>x.score>=35&&x.score<60)],['Neutral',c(x=>x.score>-15&&x.score<35)],['Bearish',c(x=>x.score<=-15&&x.score>-60)],['Strong Bearish',c(x=>x.score<=-60)]].map(x=>'<div class="stat"><div class="muted">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>').join('');document.getElementById('heat').innerHTML=a.slice().sort((x,y)=>y.score-x.score).map(x=>{const s=+x.score,cl=s>=35?'pos':s<=-15?'neg':'neutral',tile=s>=60?'bull-strong':s>=35?'bull':s<=-60?'bear-strong':s<=-15?'bear':'neutral-tile',w=Math.min(100,Math.abs(s));return '<a class="tile '+tile+'" href="./index.html?stock='+encodeURIComponent(x.ticker)+'"><div><b>'+esc(x.ticker)+'</b><div class="muted">'+esc(x.name)+'</div></div><div class="score '+cl+'">'+(s>0?'+':'')+esc(s.toFixed(1))+'</div><div class="muted">'+esc(x.signal)+' · '+esc(x.agree)+'/'+esc(x.total)+'</div><div class="bar"><i class="'+(s<0?'neg':'')+'" style="width:'+w+'%"></i></div></a>'}).join('')}load().catch(()=>document.getElementById('heat').innerHTML='<div class="muted">Data belum tersedia.</div>');</script></body></html>
