name: Alpha Vantage Reference Check

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/alpha_vantage_reference_check.py'
      - '.github/workflows/alpha-vantage-reference-check.yml'

permissions:
  contents: write

concurrency:
  group: alpha-vantage-reference-check
  cancel-in-progress: false

jobs:
  reference-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run low-volume provider diagnostics
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python scripts/alpha_vantage_reference_check.py

      - name: Commit sanitized diagnostic status
        run: |
          if [ -z "$(git status --porcelain -- data/alpha-vantage-reference-status.json)" ]; then
            echo "Diagnostic status unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alpha-vantage-reference-status.json
          git commit -m "Update Alpha Vantage reference diagnostics"
          git push
