name: Update Screener & Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "recommendations.html"
      - "admin.html"
      - "scripts/**"
      - "universe.csv"
      - ".github/workflows/update-screener.yml"
  schedule:
    - cron: "30 12 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.50,<1" "pandas>=2.2,<3" "numpy>=1.26,<3"

      - name: Test signal engine
        run: python scripts/test_signal_transitions.py

      - name: Fetch market data
        run: python scripts/fetch_data.py

      - name: Build technical signals
        run: python scripts/build_signals.py

      - name: Commit fresh screener and signal data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/screener.json data/signals.json data/signal-history.json
          git diff --cached --quiet || git commit -m "chore: update screener and technical signals"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/screener.json"))
          s=json.load(open("data/signals.json"))
          print(f"Screener: {d['success_count']}/{d['universe_count']} saham, asof {d['asof']}")
          print(f"Signals: {s['signals_count']}, NEW BULLISH: {s['new_bullish_count']}, AI queue: {s['ai_queue_count']}")
          PY
