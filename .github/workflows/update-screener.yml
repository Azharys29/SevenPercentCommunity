name: Update Screener & Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/**"
      - "universe.csv"
      - ".github/workflows/update-screener.yml"
  schedule:
    # 19:30 WIB (12:30 UTC), Monday-Friday.
    - cron: "30 12 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Fetch market data
        run: python scripts/fetch_data.py

      - name: Commit fresh screener data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/screener.json
          git diff --cached --quiet || git commit -m "chore: update screener data"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "Screener generated successfully."
          echo "Latest data: $(python -c 'import json; print(json.load(open("data/screener.json"))["asof"])')"
          echo "Universe: $(python -c 'import json; d=json.load(open("data/screener.json")); print(str(d["success_count"])+"/"+str(d["universe_count"]))')"
