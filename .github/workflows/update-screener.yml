name: Update Screener & Deploy

on:
  workflow_dispatch:
    inputs:
      external:
        description: "Triggered by external scheduler"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "index.html"
      - "recommendations.html"
      - "admin.html"
      - "ai-insights.html"
      - "new-bullish.html"
      - "heatmap.html"
      - "sector-rotation.html"
      - "backtest.html"
      - "relative-strength.html"
      - "momentum-dashboard.html"
      - "catalyst-calendar.html"
      - "value-gap.html"
      - "recommendation-report.html"
      - "recommendation-analytics.html"
      - "system-health.html"
      - "stock-detail.html"
      - "technical-journal.html"
      - "scripts/**"
      - "universe.csv"
      - ".github/workflows/update-screener.yml"
  schedule:
    # Every hour during IDX trading hours, Monday-Friday.
    # 02:17-09:17 UTC = 09:17-16:17 WIB.
    - cron: "17 2-9 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "screener-build"
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      should_run: ${{ steps.freshness.outputs.should_run }}
    steps:
      - name: Check existing data freshness
        id: freshness
        env:
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EXTERNAL: ${{ inputs.external || false }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request

          repo = os.environ["REPO"]
          event_name = os.environ.get("EVENT_NAME")
          external = os.environ.get("EXTERNAL", "false").lower() == "true"

          if event_name == "push" or (event_name == "workflow_dispatch" and not external):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("should_run=true\n")
              print(f"{event_name} trigger: force build.")
              raise SystemExit(0)

          url = f"https://raw.githubusercontent.com/{repo}/main/data/momentum.json?v={dt.datetime.now(dt.timezone.utc).timestamp()}"
          try:
              req = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
              with urllib.request.urlopen(req, timeout=15) as response:
                  data = json.load(response)
              generated = data.get("generated")
              if not generated:
                  raise ValueError("missing generated timestamp")

              generated_dt = dt.datetime.fromisoformat(generated.replace("Z", "+00:00"))
              age_min = (dt.datetime.now(dt.timezone.utc) - generated_dt).total_seconds() / 60
              print(f"Latest generated data: {generated}")
              print(f"Data age: {age_min:.1f} minutes")

              # Native GitHub schedule and the external trigger may overlap.
              # If another run already refreshed the data recently, skip the
              # expensive duplicate build. Concurrency queues overlapping runs,
              # so the second run sees the first run's fresh timestamp.
              if age_min <= 50:
                  print("Data is fresh; skip duplicate build.")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write("should_run=false\\n")
              else:
                  print("Data is stale; run the screener build.")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write("should_run=true\\n")
          except Exception as exc:
              print(f"Freshness check unavailable ({exc}); allowing build.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("should_run=true\\n")
          PY

  build:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.50,<1" "pandas>=2.2,<3" "numpy>=1.26,<3"
      - name: Test signal engine
        run: python scripts/test_signal_transitions.py
      - name: Test Market Intelligence rules
        run: python scripts/test_market_intelligence.py
      - name: Test Backtest engine
        run: python scripts/test_backtest.py
      - name: Test Relative Strength engine
        run: python scripts/test_relative_strength.py
      - name: Test Momentum Dashboard engine
        run: python scripts/test_momentum.py
      - name: Test Catalyst Calendar engine
        run: python scripts/test_catalysts.py
      - name: Test Value Gap engine
        run: python scripts/test_value_gap.py
      - name: Fetch market data
        run: python scripts/fetch_data.py
      - name: Build technical signals
        run: python scripts/build_signals.py
      - name: Build Market Intelligence + news
        run: python scripts/build_market_intelligence.py
      - name: Build Sector Rotation
        run: python scripts/build_sector_rotation.py
      - name: Build Signal Backtest
        run: python scripts/build_backtest.py
      - name: Build Relative Strength
        run: python scripts/build_relative_strength.py
      - name: Build Momentum Dashboard
        run: python scripts/build_momentum.py
      - name: Build Catalyst Calendar
        run: python scripts/build_catalysts.py
      - name: Build Value Gap
        run: python scripts/build_value_gap.py
      - name: Build Technical Trade Journal
        run: python scripts/build_technical_journal.py
      - name: Validate cross-module data integrity
        run: python scripts/test_system_integrity.py
      - name: Commit fresh screener, signals and intelligence data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep freshly generated files safe while synchronizing with a newer main.
          mkdir -p /tmp/generated-data
          cp data/screener.json data/signals.json data/signal-history.json data/market-intelligence.json data/sector-rotation.json data/backtest.json data/relative-strength.json data/momentum.json data/catalysts.json data/value-gap.json data/technical-journal.json /tmp/generated-data/

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/generated-data/screener.json data/screener.json
          cp /tmp/generated-data/signals.json data/signals.json
          cp /tmp/generated-data/signal-history.json data/signal-history.json
          cp /tmp/generated-data/market-intelligence.json data/market-intelligence.json
          cp /tmp/generated-data/sector-rotation.json data/sector-rotation.json
          cp /tmp/generated-data/backtest.json data/backtest.json
          cp /tmp/generated-data/relative-strength.json data/relative-strength.json
          cp /tmp/generated-data/momentum.json data/momentum.json
          cp /tmp/generated-data/catalysts.json data/catalysts.json
          cp /tmp/generated-data/value-gap.json data/value-gap.json
          cp /tmp/generated-data/technical-journal.json data/technical-journal.json

          git add data/screener.json data/signals.json data/signal-history.json data/market-intelligence.json data/sector-rotation.json data/backtest.json data/relative-strength.json data/momentum.json data/catalysts.json data/value-gap.json data/technical-journal.json
          git diff --cached --quiet || git commit -m "chore: update screener, signals and market intelligence"
          git push origin HEAD:main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Summary
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/screener.json")); s=json.load(open("data/signals.json")); m=json.load(open("data/market-intelligence.json")); r=json.load(open("data/sector-rotation.json")); b=json.load(open("data/backtest.json")); mm=json.load(open("data/momentum.json"))
          print(f"Screener: {d['success_count']}/{d['universe_count']} saham, asof {d['asof']}")
          print(f"Signals: {s['signals_count']}, NEW BULLISH: {s['new_bullish_count']}")
          print(f"Market Intelligence: {m['candidate_count']} candidates, {sum(len(x['news']) for x in m['items'])} news articles")
          print(f"Sector Rotation: {r['sector_count']} sectors, asof {r['asof']}")
          print(f"Backtest: {b['signal_count']} NEW BULLISH events, 20D avg {b['summary']['20']['avg_return']}%")
          cc=json.load(open("data/catalysts.json")); vg=json.load(open("data/value-gap.json"))
          print(f"Momentum: {mm['universe_count']} stocks, top {mm['stocks'][0]['ticker']} ({mm['stocks'][0]['momentum_score']})")
          print(f"Catalysts: {cc['event_count']} events, {cc['window_start']} to {cc['window_end']}")
          top=next((x for x in vg["stocks"] if x["value_gap_score"] is not None), None)
          print(f"Value Gap: {vg['valid_count']} valid, top {top['ticker']} ({top['value_gap_score']})" if top else "Value Gap: no valid rows")
          PY