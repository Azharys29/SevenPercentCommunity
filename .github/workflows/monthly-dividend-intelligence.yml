name: Monthly Dividend Intelligence Refresh

on:
  schedule:
    # Monthly on the 3rd at 04:10 UTC (11:10 WIB).
    - cron: "10 4 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "monthly-dividend-intelligence"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.50,<1" "pandas>=2.2,<3" "numpy>=1.26,<3"
      - name: Test Dividend Intelligence calculations
        run: python scripts/test_dividend_intelligence.py
      - name: Build Dividend Intelligence
        run: python scripts/build_dividend_intelligence.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/dividend-intelligence.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d.get("universe") == "KOMPAS100"
          assert isinstance(d.get("stocks"), list) and len(d["stocks"]) >= 50, "Universe output unexpectedly small; refusing to publish"
          assert all("ticker" in x for x in d["stocks"])
          print(f"Validated {len(d['stocks'])} stocks; {d.get('valid_price_count')} prices")
          PY
      - name: Commit Dividend Intelligence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dividend-intelligence.json
          git diff --cached --quiet || git commit -m "chore: monthly Dividend Intelligence refresh"
          git push origin HEAD:main
