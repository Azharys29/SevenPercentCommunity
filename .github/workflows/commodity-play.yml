name: Commodity Play

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1-5"
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

jobs:
  update-commodity-play:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install requests openpyxl

      - name: Fetch free World Bank + Kemendag commodity data
        run: python scripts/fetch_commodity_play.py

      - name: Commit updated Commodity Play data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/commodity-play.json
          git diff --cached --quiet || git commit -m "Update Commodity Play data"
          git push
