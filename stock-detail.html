p:12px}.commodity-item{background:var(--panel2);border:1px solid #1B2836;padding:11px}.commodity-item small{display:block;color:var(--tx3);font-size:10px}.commodity-item b{display:block;margin-top:3px}@media(max-width:800px){.commodity-list{grid-template-columns:1fr}}.metric{background:var(--panel2);padding:13px;border:1px solid #1B2836}.metric small{display:block;color:var(--tx3);font-size:11px}.metric b{font-size:18px}.up{color:var(--up)}.dn{color:var(--dn)}.neutral{color:var(--tx2)}.pill{display:inline-block;border:1px solid var(--line);padding:4px 9px;border-radius:999px;font-size:11px}.section-title{margin:0 0 14px;font-size:18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tablewrap{overflow:auto}.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{text-align:left;padding:9px;border-bottom:1px solid #1B2836;white-space:nowrap}.tbl th{color:var(--tx3);font-size:11px;text-transform:uppercase}.indicator-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.ind{padding:12px;background:var(--panel2);border:1px solid #1B2836}.ind small{color:var(--tx3);display:block}.ind b{display:block;margin-top:4px}.note{color:var(--tx2)}.link{color:var(--ice);text-decoration:none}.loading{color:var(--tx3);padding:30px 0}.error{color:var(--dn)}.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}.chart-card{border:1px solid #1B2836;background:var(--panel2);padding:14px}.chart-card h3{margin:0 0 8px;font-size:14px;color:var(--cream)}.chart-svg{width:100%;height:230px;display:block;background:var(--bg);border:1px solid #1B2836}.chart-legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--tx3);font-size:11px;margin-top:7px}.chart-legend span{display:inline-flex;align-items:center;gap:5px}.chart-legend i{width:18px;height:2px;background:currentColor;display:inline-block}.chart-legend .dash{background:transparent;border-top:2px dashed currentColor;height:0}@media(max-width:800px){.charts{grid-template-columns:1fr}}@media(max-width:800px){.grid,.indicator-grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}h1{font-size:32px}}@media(max-width:500px){.grid,.indicator-grid{grid-template-columns:1fr}.herohead{flex-direction:column}}
</style></head><body><div class="wrap">
<header class="top"><div class="brand">SEVENPERCENTCOMMUNITY</div><details class="menu"><summary>☰ Menu</summary><div class="menu-panel"><a href="./index.html">Screener</a><a href="./fundamental.html">Fundamental</a><a href="./teknikal.html">Teknikal</a><a href="./market-intelligence.html">Market Intelligence</a><a href="./recommendations.html">Rekomendasi</a><a href="./system-health.html">System Health</a><a href="./admin.html">Admin</a></div></details></header>
<h1>Unified Stock Detail</h1><div class="sub">Satu halaman untuk menggabungkan Technical, Momentum, Relative Strength, Value Gap, Earnings, dan Recommendation.</div>
<div class="search"><input id="ticker" placeholder="Masukkan ticker, mis. BBCA" autocomplete="off"><button class="btn" id="go">Lihat</button></div>
<div id="app" class="loading">Memuat data…</div>
</div>
<script>
const SB_URL="https://njghchwtcyoieymkodzj.supabase.co",SB_KEY="sb_publishable_PqtSIs0LASiKcUjW8P3cJw_W27mGAoJ";
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const num=(v,d=2)=>v==null||v===""||!isFinite(Number(v))?"—":new Intl.NumberFormat("id-ID",{maximumFractionDigits:d}).format(Number(v));
const pct=v=>v==null||!isFinite(Number(v))?"—":num(v,2)+"%";
const tone=v=>Number(v)>0?"up":Number(v)<0?"dn":"neutral";
let DATA={};
async function json(p){const r=await fetch(p,{cache:"no-cache"});if(!r.ok)throw Error(p+" HTTP "+r.status);return r.json()}
async function load(){
 try{
  const [sc,si,mo,rs,vg,ca,cp]=await Promise.all([
   json("./data/screener.json").catch(()=>({stocks:[]})),
   json("./data/signals.json"),
   json("./data/momentum.json"),
   json("./data/relative-strength.json"),
   json("./data/value-gap.json"),
   json("./data/catalysts.json").catch(()=>({events:[]})),
   json("./data/commodity-play.json").catch(()=>({impacts:[],commodities:[]}))
  ]);
  const stocks=(sc.stocks&&sc.stocks.length)?sc.stocks:(mo.stocks||[]).map(m=>({t:m.ticker,n:m.name||m.ticker,sec:m.sector,c:[m.price],s:"KOMPAS100",ix:[]}));
  DATA={sc:{...sc,stocks},si,mo,rs,vg,ca,cp}; render();
 }catch(e){$("#app").innerHTML='<div class="error">Gagal memuat data: '+esc(e.message)+'</div>'}
}
async function recommendations(t){
 try{const r=await fetch(SB_URL+"/rest/v1/recommendations?select=*&ticker=eq."+encodeURIComponent(t)+"&order=created_at.desc",{headers:{apikey:SB_KEY}});return r.ok?await r.json():[]}catch{return []}
}
function seriesFrom(v){const a=Array.isArray(v)?v:v&&Array.isArray(v.values)?v.values:[];return a.map(z=>typeof z==="object"?(z.close??z.c??z.value):z).map(Number).filter(Number.isFinite)}
function sma(a,n){return a.map((_,i)=>i+1<n?null:a.slice(i-n+1,i+1).reduce((s,v)=>s+v,0)/n)}
function ema(a,n){if(!a.length)return[];const k=2/(n+1),o=Array(a.length).fill(null);let e=a[0];o[0]=e;for(let i=1;i<a.length;i++){e=a[i]*k+e*(1-k);o[i]=e}return o}
function rsi(a,n=14){const o=Array(a.length).fill(null);if(a.length<=n)return o;let g=0,l=0;for(let i=1;i<=n;i++){const d=a[i]-a[i-1];if(d>0)g+=d;else l-=d}let ag=g/n,al=l/n;o[n]=al===0?100:100-100/(1+ag/al);for(let i=n+1;i<a.length;i++){const d=a[i]-a[i-1],gg=Math.max(d,0),ll=Math.max(-d,0);ag=(ag*(n-1)+gg)/n;al=(al*(n-1)+ll)/n;o[i]=al===0?100:100-100/(1+ag/al)}return o}
function stoch(a,n=14,s=3){const k=Array(a.length).fill(null),d=Array(a.length).fill(null);for(let i=n-1;i<a.length;i++){const w=a.slice(i-n+1,i+1),lo=Math.min(...w),hi=Math.max(...w);k[i]=hi===lo?50:(a[i]-lo)/(hi-lo)*100}for(let i=s-1;i<a.length;i++){const w=k.slice(i-s+1,i+1).filter(Number.isFinite);if(w.length===s)d[i]=w.reduce((x,y)=>x+y,0)/s}return{k,d}}
function path(vals,min,max,w=760,h=220,p=22){const pts=[];vals.forEach((v,i)=>{if(v==null||!Number.isFinite(v))return;const x=p+(i/(Math.max(vals.length-1,1)))*(w-2*p),y=h-p-((v-min)/(max-min||1))*(h-2*p);pts.push((pts.length?"L":"M")+x.toFixed(1)+","+y.toFixed(1))});return pts.join(" ")}
function chartSvg(title,sets,opts={}){const all=sets.flatMap(s=>s.v.filter(Number.isFinite));const min=opts.min??Math.min(...all),max=opts.max??Math.max(...all),pad=(max-min||1)*.08,lo=opts.min!=null?opts.min:min-pad,hi=opts.max!=null?opts.max:max+pad,w=760,h=220;const lines=sets.map(s=>s.v.length?'<path d="'+path(s.v,lo,hi,w,h)+'" fill="none" stroke="'+(s.d?"#85B7EB":"#F2EBDD")+'" stroke-width="2" '+(s.d?'stroke-dasharray="5 4"':"")+'/>':"").join("");const grids=[0,.25,.5,.75,1].map(q=>{const y=22+q*176;return '<line x1="22" x2="738" y1="'+y+'" y2="'+y+'" stroke="#1B2836"/><text x="28" y="'+(y-4)+'" fill="#7C879A" font-size="10">'+num(hi-(hi-lo)*q,1)+'</text>'}).join("");return '<div class="chart-card"><h3>'+esc(title)+'</h3><svg class="chart-svg" viewBox="0 0 '+w+" "+h+'" preserveAspectRatio="none">'+grids+lines+'</svg><div class="chart-legend">'+sets.map(s=>'<span><i class="'+(s.d?"dash":"")+'" style="color:'+(s.d?"#85B7EB":"#F2EBDD")+'"></i>'+esc(s.n)+'</span>').join("")+'</div></div>'}
function renderCharts(x){const a=seriesFrom(x.s.c);if(a.length<15){$("#charts").innerHTML='<p class="note">Histori harga belum cukup untuk menampilkan chart indikator.</p>';return}const e12=ema(a,12),e26=ema(a,26),mac=e12.map((v,i)=>v-(e26[i]??v)),sig=ema(mac,9),st=stoch(a);$("#charts").innerHTML=chartSvg("Price & Moving Average",[{n:"Price",v:a},{n:"MA20",v:sma(a,20),d:true},{n:"MA50",v:sma(a,50),d:true},{n:"MA200",v:sma(a,200),d:true}])+chartSvg("RSI (14)",[{n:"RSI",v:rsi(a)}],{min:0,max:100})+chartSvg("MACD (12,26,9)",[{n:"MACD",v:mac},{n:"Signal",v:sig,d:true}])+chartSvg("Stochastic (14,3)",[{n:"%K",v:st.k},{n:"%D",v:st.d,d:true}],{min:0,max:100})}
function recOutcome(r){
 const s=String(r.auto_status||"").toUpperCase(), entry=(Number(r.entry_min)+Number(r.entry_max))/2;
 if(s.includes("TP2")) return {label:"TP2 HIT",ret:(Number(r.tp2)/entry-1)*100};
 if(s.includes("TP1")) return {label:"TP1 HIT",ret:(Number(r.tp1)/entry-1)*100};
 if(s.includes("STOP LOSS")) return {label:"STOP LOSS HIT",ret:(Number(r.stop_loss)/entry-1)*100};
 return {label:"OPEN",ret:(Number(r.current_price)/entry-1)*100};
}
function find(t){
 const si=DATA.si.signals.find(x=>x.ticker===t), m=DATA.mo.stocks.find(x=>x.ticker===t), base=DATA.sc.stocks.find(x=>x.t===t);
 const s=base|| (m?{t:m.ticker,n:m.name||m.ticker,sec:m.sector,c:[m.price],s:"KOMPAS100",ix:[]}:null);
 return {s,si,mo:m,rs:DATA.rs.stocks.find(x=>x.ticker===t),vg:DATA.vg.stocks.find(x=>x.ticker===t),ca:DATA.ca.events.filter(x=>x.ticker===t),cp:(DATA.cp.impacts||[]).filter(x=>x.ticker===t)}
}
function commodityBlock(x){
 const arr=x.cp||[];
 if(!arr.length) return '<section class="commodity-box"><div class="commodity-head"><div><h2 class="section-title">Commodity Play</h2><div class="note">Belum ada commodity exposure data untuk ticker ini.</div></div></div></section>';
 const impact=arr.reduce((s,a)=>s+(Number(a.impact_score)||0),0);
 const technical=Number(x.si?.score)||0;
 const confluence=Number(x.si?.agree)||0;
 const rvol=Number(x.si?.rvol)||0;
 let stars=1;
 if(Math.abs(impact)>=1)stars=2;
 if(Math.abs(impact)>=2)stars=3;
 if(technical>=50&&confluence>=3)stars=Math.max(stars,4);
 if(technical>=65&&confluence>=4&&rvol>=1.5&&Math.abs(impact)>=2)stars=5;
 const starText='★'.repeat(stars)+'☆'.repeat(5-stars);
 const items=arr.map(a=>'<div class="commodity-item"><small>'+esc(a.commodity)+' · '+esc(a.expected_direction)+'</small><b class="'+tone(a.impact_score)+'">'+(a.impact_score>=0?'+':'')+num(a.impact_score,2)+'</b><span class="sub">'+(Number(a.commodity_change_pct)>=0?'+':'')+num(a.commodity_change_pct,2)+'% commodity</span></div>').join('');
 return '<section class="commodity-box"><div class="commodity-head"><div><h2 class="section-title">COMMODITY PLAY</h2><div class="stars">'+starText+'</div></div><div style="text-align:right"><div class="sub">Commodity Impact</div><div class="commodity-impact '+tone(impact)+'">'+(impact>=0?'+':'')+num(impact,2)+'</div></div></div><div class="grid" style="margin-top:12px"><div class="metric"><small>COMMODITY IMPACT</small><b class="'+tone(impact)+'">'+(impact>=0?'+':'')+num(impact,2)+'</b></div><div class="metric"><small>TECHNICAL SCORE</small><b>'+num(technical,0)+'</b></div><div class="metric"><small>CONFLUENCE</small><b>'+confluence+'/5</b></div><div class="metric"><small>RVOL</small><b>'+num(rvol,2)+'x</b></div></div><div class="commodity-list">'+items+'</div><p class="note">Commodity Impact adalah indikator eksposur mekanis berdasarkan perubahan benchmark komoditas × mapping; bukan target harga.</p></section>';
}
async function render(){
 const t=(new URLSearchParams(location.search).get("stock")||$("#ticker").value||"").trim().toUpperCase();
 if(!t){$("#app").innerHTML='<div class="card">Masukkan ticker untuk melihat unified stock detail.</div>';return}
 $("#ticker").value=t; const x=find(t);
 if(!x.s||!x.si){$("#app").innerHTML='<div class="error">Ticker '+esc(t)+' tidak ditemukan di universe KOMPAS100.</div>';return}
 const recs=await recommendations(t);
 const comp=[
  ["RSI",num(x.si.rsi,2),tone(50-x.si.rsi)],["Stochastic K",num(x.si.stoch_k,2),tone(x.si.stoch_k-50)],
  ["MACD Hist %",pct(x.si.macd_hist_pct),tone(x.si.macd_hist_pct)],["RVOL",num(x.si.rvol,2),tone(x.si.rvol-1)],
  ["EMA20",x.si.ema20_trend?"Above price":"Below price",x.si.ema20_trend?"up":"dn"]
 ];
 const outcomes=recs.map(recOutcome), realized=outcomes.filter(o=>o.label!=="OPEN"), wins=realized.filter(o=>o.ret>0), avg=outcomes.length?outcomes.reduce((a,o)=>a+o.ret,0)/outcomes.length:0;
 const recRows=recs.length?recs.map((r,i)=>{const o=outcomes[i];return '<tr><td>'+esc(new Date(r.created_at).toLocaleDateString("id-ID"))+'</td><td>Rp '+num(r.entry_min)+' – '+num(r.entry_max)+'</td><td>Rp '+num(r.tp1)+'</td><td>Rp '+num(r.tp2)+'</td><td>Rp '+num(r.stop_loss)+'</td><td>'+esc(o.label)+'</td><td class="'+tone(o.ret)+'">'+pct(o.ret)+'</td></tr>'}).join(""):'<tr><td colspan="7">Belum ada rekomendasi untuk ticker ini.</td></tr>';
 const newsUrl="https://finance.yahoo.com/quote/"+encodeURIComponent(t)+".JK/";
 $("#app").innerHTML=
 '<section class="hero"><div class="herohead"><div><div class="ticker">'+esc(t)+' <span class="pill">'+esc(x.s.s||"")+'</span></div><div class="sub">'+esc(x.s.n||t)+' · '+esc(x.s.sec||"")+' · '+esc((x.s.ix||[]).join(", "))+'</div><div class="price">Rp '+num(x.s.c?.at(-1))+'</div><div class="sub">As of '+esc(DATA.si.asof)+' · Generated '+esc(DATA.si.generated)+'</div></div><div class="'+tone(x.si.score)+'" style="text-align:right"><div style="font-size:28px;font-weight:700">'+num(x.si.score,2)+'</div><b>'+esc(x.si.signal)+' · '+esc(x.si.strength)+'</b><div class="sub">'+x.si.agree+' / '+x.si.total+' confluence</div></div></div></section>'+
 '<section class="grid">'+
 '<div class="metric"><small>TECHNICAL SCORE</small><b class="'+tone(x.si.score)+'">'+num(x.si.score,2)+'</b></div>'+
 '<div class="metric"><small>CONFLUENCE</small><b>'+x.si.agree+' / '+x.si.total+'</b></div>'+
 '<div class="metric"><small>MOMENTUM SCORE</small><b>'+num(x.mo?.momentum_score,1)+'</b><div class="sub">'+esc(x.mo?.momentum_label||"—")+'</div></div>'+
 '<div class="metric"><small>RS SCORE</small><b>'+num(x.rs?.rs_score,1)+'</b><div class="sub">Rank '+num(x.rs?.rank,0)+'</div></div>'+
 '</section>'+
 commodityBlock(x)+
 '<section class="card"><h2 class="section-title">Technical Snapshot</h2><div class="indicator-grid">'+comp.map(a=>'<div class="ind"><small>'+a[0]+'</small><b class="'+a[2]+'">'+esc(a[1])+'</b></div>').join("")+'</div><p class="note">EMA20: Rp '+num(x.si.ema20)+' · Stochastic '+num(x.si.stoch_k,1)+' / '+num(x.si.stoch_d,1)+' · RVOL '+num(x.si.rvol,2)+'</p></section>'+
 '<section class="two"><div class="card"><h2 class="section-title">Momentum</h2><table class="tbl"><tr><td>5D Return</td><td class="'+tone(x.mo?.return_5d)+'">'+pct(x.mo?.return_5d)+'</td></tr><tr><td>20D Return</td><td class="'+tone(x.mo?.return_20d)+'">'+pct(x.mo?.return_20d)+'</td></tr><tr><td>MA Trend Points</td><td>'+num(x.mo?.trend_points,0)+'/5</td></tr><tr><td>RSI</td><td>'+num(x.mo?.rsi,2)+'</td></tr></table></div>'+
 '<div class="card"><h2 class="section-title">Relative Strength</h2><table class="tbl"><tr><td>RS Score</td><td>'+num(x.rs?.rs_score,1)+'</td></tr><tr><td>Return vs IHSG</td><td class="'+tone(x.rs?.vs_ihsg)+'">'+pct(x.rs?.vs_ihsg)+'</td></tr><tr><td>Return vs Sector</td><td class="'+tone(x.rs?.vs_sector)+'">'+pct(x.rs?.vs_sector)+'</td></tr><tr><td>Rank</td><td>'+num(x.rs?.rank,0)+'</td></tr></table></div></section>'+
 '<section class="two"><div class="card"><h2 class="section-title">Value Gap</h2>'+(x.vg?'<table class="tbl"><tr><td>Current PER</td><td>'+num(x.vg.current_pe)+'</td></tr><tr><td>PER Avg 3Y</td><td>'+num(x.vg.avg_pe_3y)+'</td></tr><tr><td>EPS Growth</td><td class="'+tone(x.vg.eps_growth)+'">'+pct(x.vg.eps_growth)+'</td></tr><tr><td>Value Gap Score</td><td>'+num(x.vg.value_gap_score)+'</td></tr><tr><td>1M Return</td><td class="'+tone(x.vg.return_1m)+'">'+pct(x.vg.return_1m)+'</td></tr><tr><td>YTD Return</td><td class="'+tone(x.vg.return_ytd)+'">'+pct(x.vg.return_ytd)+'</td></tr></table>':'<p class="note">Tidak tersedia.</p>')+'</div>'+
 '<div class="card"><h2 class="section-title">Earnings / Catalyst</h2>'+(x.ca.length?x.ca.map(e=>'<p><b>'+esc(e.date)+'</b> · '+esc(e.title||"Earnings")+'<br><span class="sub">'+esc(e.importance||"")+'</span></p>').join(""):'<p class="note">Tidak ada earnings event pada window aktif.</p>')+'<a class="link" target="_blank" rel="noopener" href="'+newsUrl+'">Buka Yahoo Finance / News ↗</a></div></section>'+
 '<section class="card"><h2 class="section-title">Recommendation Journal</h2><div class="grid"><div class="metric"><small>RECOMMENDATIONS</small><b>'+recs.length+'</b></div><div class="metric"><small>REALIZED WIN RATE</small><b>'+ (realized.length?pct(wins.length/realized.length*100):"—") +'</b></div><div class="metric"><small>AVERAGE P/L</small><b class="'+tone(avg)+'">'+(recs.length?pct(avg):"—")+'</b></div><div class="metric"><small>REALIZED</small><b>'+realized.length+'</b></div></div><div class="tablewrap" style="margin-top:14px"><table class="tbl"><thead><tr><th>Date</th><th>Entry</th><th>TP1</th><th>TP2</th><th>SL</th><th>Status</th><th>P/L</th></tr></thead><tbody>'+recRows+'</tbody></table></div></section>'+
 '<section class="card"><h2 class="section-title">Indicator Charts</h2><p class="note">Chart dihitung dari histori harga EOD yang sama dengan screener. Menampilkan Price & MA, RSI, MACD, dan Stochastic untuk ticker yang dipilih.</p><div id="charts" class="charts"></div></section><section class="card"><h2 class="section-title">Historical Price</h2><div class="note">Data harga EOD tersedia di screener. Halaman detail ini menggunakan data yang sama sehingga snapshot antar-modul tetap mengacu pada tanggal as-of yang sama.</div></section>';
 renderCharts(x);
}
$("#go").onclick=()=>{const t=$("#ticker").value.trim().toUpperCase();if(t)history.replaceState(null,"","?stock="+encodeURIComponent(t));render()};
$("#ticker").addEventListener("keydown",e=>{if(e.key==="Enter")$("#go").click()});
load();
</script></body></html>
