<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Rekomendasi — SevenPercentCommunity</title>
<style>
:root{--bg:#090D13;--panel:#0F151D;--panel2:#141C26;--line:#2E4A68;--tx:#F3F6FA;--tx2:#A3ADBC;--tx3:#7C879A;--ice:#85B7EB;--cream:#F2EBDD;--bad:#d99}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px 18px 50px}.top{display:flex;justify-content:space-between;border-bottom:1px solid #1B2836;padding-bottom:16px}.brand{color:var(--ice);font:12px monospace;letter-spacing:.12em}.nav a{color:var(--tx2);text-decoration:none;margin-left:14px}.panel{margin-top:28px;border:1px solid var(--line);background:var(--panel);padding:20px;border-radius:5px}h1{color:var(--cream);font-size:34px}h2{font-size:20px;color:var(--cream)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;color:var(--tx3);font-size:12px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);padding:9px;border-radius:4px}.field textarea{min-height:100px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--tx);padding:9px 13px;border-radius:4px;cursor:pointer}.btn.pri{background:var(--ice);border-color:var(--ice);color:#08101A;font-weight:700}.msg{margin:10px 0;color:var(--tx2)}.error{color:var(--bad)}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid #1B2836;font-size:13px}th{color:var(--tx3)}.hidden{display:none}.login{max-width:460px;margin:50px auto}.hint{color:var(--tx3);font-size:12px} @media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}table{font-size:11px}}
</style></head><body><div class="wrap">
<header class="top"><div class="brand">SEVENPERCENTCOMMUNITY · ADMIN</div><nav class="nav"><a href="./index.html">Screener</a><a href="./recommendations.html">Rekomendasi</a></nav></header>
<section id="login" class="panel login"><h1>Admin Login</h1><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field" style="margin-top:10px"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button class="btn pri" id="loginBtn">Login</button></div><div id="loginMsg" class="msg"></div><p class="hint">Akun login dikelola melalui Supabase Auth. Hanya email yang terdaftar sebagai admin yang dapat menambah, mengubah, atau menghapus rekomendasi.</p></section>
<section id="app" class="hidden">
<div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h1>Kelola Rekomendasi</h1><button class="btn" id="logout">Logout</button></div>
<form id="form"><input id="id" type="hidden"><div class="grid">
<div class="field"><label>Ticker</label><input id="ticker" required placeholder="BBCA"></div>
<div class="field"><label>Status</label><select id="status"><option value="active">Active</option><option value="closed">Closed</option></select></div>
<div class="field"><label>Entry Min</label><input id="entry_min" type="number" step="any" min="0.01" required></div>
<div class="field"><label>Entry Max</label><input id="entry_max" type="number" step="any" min="0.01" required></div>
<div class="field"><label>TP1</label><input id="tp1" type="number" step="any" min="0.01" required></div>
<div class="field"><label>TP2</label><input id="tp2" type="number" step="any" min="0.01" required></div>
<div class="field"><label>Stop Loss</label><input id="stop_loss" type="number" step="any" min="0.01" required></div>
<div class="field full"><label>Keterangan</label><textarea id="notes" placeholder="Contoh: breakout resistance + volume meningkat..."></textarea></div>
</div><div class="actions"><button class="btn pri" type="submit">Simpan Rekomendasi</button><button class="btn" type="button" id="cancel">Reset</button></div><div id="formMsg" class="msg"></div></form></div>
<div class="panel"><h2>Rekomendasi Tersimpan</h2><div id="tableMsg" class="msg"></div><div style="overflow:auto"><table><thead><tr><th>Ticker</th><th>Entry</th><th>TP1</th><th>TP2</th><th>SL</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</section></div>
<script>
const SB_URL="https://njghchwtcyoieymkodzj.supabase.co";
const SB_KEY="sb_publishable_PqtSIs0LASiKcUjW8P3cJw_W27mGAoJ";
const $=s=>document.querySelector(s); let current=null, accessToken=null;
function msg(el,text,err=false){el.textContent=text;el.className='msg'+(err?' error':'')}
function headers(token){return {'apikey':SB_KEY,'Authorization':'Bearer '+(token||SB_KEY),'Content-Type':'application/json'}}
async function api(path,opts={},token=null){
 const r=await fetch(SB_URL+path,{...opts,headers:{...headers(token),...(opts.headers||{})}});
 let data=null; try{data=await r.json()}catch{}
 if(!r.ok) throw new Error(data?.msg||data?.message||data?.error_description||data?.error||('HTTP '+r.status));
 return data;
}
async function check(){
 const raw=localStorage.getItem('spc_admin_session');
 if(!raw)return;
 try{
  const s=JSON.parse(raw); accessToken=s.access_token;
  const user=await api('/auth/v1/user',{method:'GET'},accessToken);
  const isAdmin=await api('/rest/v1/rpc/is_recommendation_admin',{method:'POST',body:'{}'},accessToken);
  if(isAdmin===true){current=user;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await load()}
  else{logoutLocal();msg($('#loginMsg'),'Akun ini belum terdaftar sebagai admin.',true)}
 }catch(e){logoutLocal();msg($('#loginMsg'),'Sesi tidak valid. Silakan login kembali. '+e.message,true)}
}
function logoutLocal(){localStorage.removeItem('spc_admin_session');accessToken=null;current=null}
$('#loginBtn').onclick=async()=>{
 const btn=$('#loginBtn'); btn.disabled=true; msg($('#loginMsg'),'Menghubungkan ke Supabase…');
 try{
  const email=$('#email').value.trim(), password=$('#password').value;
  if(!email||!password){msg($('#loginMsg'),'Email dan password wajib diisi.',true);return}
  const data=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});
  localStorage.setItem('spc_admin_session',JSON.stringify(data));
  accessToken=data.access_token;
  await check();
 }catch(e){msg($('#loginMsg'),'Login gagal: '+e.message,true)}
 finally{btn.disabled=false}
};
$('#logout').onclick=()=>{logoutLocal();location.reload()};
$('#cancel').onclick=()=>reset();
function reset(){ $('#form').reset();$('#id').value='';$('#status').value='active';$('#formMsg').textContent=''}
function val(id){return $('#'+id).value}
$('#form').onsubmit=async e=>{
 e.preventDefault();msg($('#formMsg'),'Menyimpan…');
 try{
  const payload={ticker:val('ticker').trim().toUpperCase(),entry_min:+val('entry_min'),entry_max:+val('entry_max'),tp1:+val('tp1'),tp2:+val('tp2'),stop_loss:+val('stop_loss'),notes:val('notes').trim(),status:val('status')};
  let path='/rest/v1/recommendations', opts={method:'POST',body:JSON.stringify({...payload,created_by:current.id}),headers:{Prefer:'return=minimal'}};
  if(val('id')){path+='/id=eq.'+encodeURIComponent(val('id'));opts.method='PATCH';opts.body=JSON.stringify(payload)}
  await api(path,opts,accessToken);msg($('#formMsg'),'Tersimpan.');reset();await load();
 }catch(e){msg($('#formMsg'),'Gagal menyimpan: '+e.message,true)}
};
async function load(){
 try{
  const data=await api('/rest/v1/recommendations?select=*&order=created_at.desc',{},accessToken);
  $('#rows').innerHTML=data.map(x=>`<tr><td><b>${x.ticker}</b></td><td>${x.entry_min}–${x.entry_max}</td><td>${x.tp1}</td><td>${x.tp2}</td><td>${x.stop_loss}</td><td>${x.status}</td><td><button class="btn" onclick='edit(${JSON.stringify(x).replace(/'/g,"&#39;")})'>Edit</button> <button class="btn" onclick="del('${x.id}')">Hapus</button></td></tr>`).join('')||'<tr><td colspan="7">Belum ada data.</td></tr>';
  msg($('#tableMsg'),'Data tersinkron.');
 }catch(e){msg($('#tableMsg'),'Gagal memuat data: '+e.message,true)}
}
window.edit=x=>{Object.keys(x).forEach(k=>{if($('#'+k))$('#'+k).value=x[k]??''});$('#id').value=x.id;scrollTo({top:0,behavior:'smooth'})};
window.del=async id=>{if(!confirm('Hapus rekomendasi ini?'))return;try{await api('/rest/v1/recommendations?id=eq.'+encodeURIComponent(id),{method:'DELETE'},accessToken);await load()}catch(e){alert(e.message)}};
check();
</script></script></body></html>
