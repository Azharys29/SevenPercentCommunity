<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEW BULLISH — SevenPercentCommunity</title><style>:root{--bg:#090D13;--panel:#0F151D;--panel2:#141C26;--line:#2E4A68;--tx:#F3F6FA;--tx2:#A3ADBC;--tx3:#7C879A;--ice:#85B7EB;--cream:#F2EBDD}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{color:var(--ice);font-size:12px;letter-spacing:.12em}.nav a{color:var(--tx2);margin-left:15px;text-decoration:none}.hero{padding:34px 0 20px}.hero h1{font:40px Georgia;margin:0 0 8px;color:var(--cream)}.muted{color:var(--tx3)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.stat,.card{border:1px solid var(--line);background:var(--panel);padding:15px}.v{font-size:28px;font-weight:bold}.card{margin:12px 0}.head{display:flex;justify-content:space-between;gap:15px;align-items:center}.ticker{font-size:24px;font-weight:bold}.badge{border:1px solid var(--ice);color:var(--ice);padding:5px 9px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}.metric{background:var(--panel2);padding:10px;border:1px solid var(--line)}.metric small{display:block;color:var(--tx3);font-size:11px}.metric b{font-size:17px}.delta,.up{color:var(--ice);font-weight:bold}.timeline{margin-top:18px}.event{border-left:2px solid var(--ice);padding:8px 0 8px 14px;margin:8px 0}.event b{font-size:16px}.empty{padding:35px;text-align:center;border:1px dashed var(--line)}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.metrics{grid-template-columns:1fr 1fr}.wrap{padding:16px}}<style id="compact-menu-style">

</style></style></head><body><div class="wrap"><header class="top"><div class="brand">SEVENPERCENTCOMMUNITY</div><nav class="menu-wrap"><details class="menu"><summary>☰ Menu</summary><div class="menu-panel"><a href="./index.html">Screener</a><a href="./recommendations.html">Rekomendasi</a><a href="./new-bullish.html">NEW Bullish</a><a href="./heatmap.html">Heatmap</a><a href="./backtest.html">Backtest</a><a href="./relative-strength.html">Relative Strength</a><a href="./sector-rotation.html">Sector Rotation</a><a href="./ai-insights.html">Market Intelligence</a><a href="./admin.html">Admin</a></div></details></nav></header><section class="hero"><h1>NEW BULLISH</h1><div class="muted">Saham yang baru masuk kondisi Bullish berdasarkan perubahan signal engine.</div></section><div id="stats" class="stats"></div><div id="list"></div><div class="timeline"><h2>Signal History</h2><div id="history"></div></div></div><script>const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));async function load(){const[sr,hr]=await Promise.all([fetch('./data/signals.json?t='+Date.now()),fetch('./data/signal-history.json?t='+Date.now())]);const s=await sr.json(),h=await hr.json(),all=s.signals||[],nb=all.filter(x=>x.new_bullish);document.getElementById('stats').innerHTML='<div class="stat"><div class="muted">Universe</div><div class="v">'+all.length+'</div></div><div class="stat"><div class="muted">NEW BULLISH</div><div class="v">'+nb.length+'</div></div><div class="stat"><div class="muted">Bullish</div><div class="v">'+all.filter(x=>x.signal==="Bullish").length+'</div></div><div class="stat"><div class="muted">As-of</div><div class="v" style="font-size:18px">'+esc(s.asof||'-')+'</div></div>';document.getElementById('list').innerHTML=nb.length?nb.sort((a,b)=>b.score-a.score).map(x=>'<article class="card"><div class="head"><div><div class="ticker">'+esc(x.ticker)+'</div><div class="muted">'+esc(x.name)+'</div></div><span class="badge">NEW BULLISH</span></div><div class="metrics"><div class="metric"><small>Score</small><b>'+esc(x.score)+'</b></div><div class="metric"><small>Score Delta</small><b class="delta">+'+esc(x.score_delta)+'</b></div><div class="metric"><small>Confluence</small><b>'+esc(x.agree)+'/'+esc(x.total)+'</b></div><div class="metric"><small>RSI</small><b>'+esc(x.rsi)+'</b></div><div class="metric"><small>Stoch K/D</small><b>'+esc(x.stoch_k)+' / '+esc(x.stoch_d)+'</b></div><div class="metric"><small>RVOL</small><b>'+esc(x.rvol)+'x</b></div></div><a href="./index.html?stock='+encodeURIComponent(x.ticker)+'" style="color:var(--ice)">Buka screener →</a></article>').join(''):'<div class="empty">Tidak ada NEW BULLISH pada update terakhir.</div>';const ev=(h.events||[]).slice().reverse();document.getElementById('history').innerHTML=ev.length?ev.map(x=>'<div class="event"><b>'+esc(x.ticker)+' — '+esc(x.signal)+'</b><div class="muted">'+esc(x.asof)+' · Score '+esc(x.previous_score)+' → <span class="up">'+esc(x.score)+'</span> · Previous: '+esc(x.previous_signal)+(x.ai_candidate?' · AI candidate':'')+'</div></div>').join(''):'<div class="empty">Belum ada event signal history.</div>'}load().catch(()=>document.getElementById('list').innerHTML='<div class="empty">Data belum tersedia.</div>');</script></body></html>
