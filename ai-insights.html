<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Research Queue — SevenPercentCommunity</title><style>
body{margin:0;background:#090D13;color:#F3F6FA;font:15px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #2E4A68;padding-bottom:16px}.brand{color:#85B7EB;font-size:12px;letter-spacing:.12em}.nav a{color:#A3ADBC;margin-left:15px;text-decoration:none}.hero{padding:35px 0 20px}.hero h1{font:40px Georgia;margin:0 0 10px}.muted{color:#7C879A}.card{border:1px solid #2E4A68;background:#0F151D;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid #2E4A68;padding:14px;background:#141C26}.v{font-size:28px;font-weight:bold}.badge{display:inline-block;border:1px solid #85B7EB;color:#ADD6FF;padding:4px 8px}.ticker{font-size:24px;font-weight:bold}.row{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.note{line-height:1.65;color:#A3ADBC}.empty{padding:35px;text-align:center;border:1px dashed #2E4A68}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><header class="top"><div class="brand">@AZHARYS.HR — CAPITAL MARKETS DESK</div><div class="nav"><a href="./index.html">Screener</a><a href="./recommendations.html">Rekomendasi</a><a href="./admin.html">Admin</a></div></header><section class="hero"><h1>AI Research Queue</h1><div class="muted">Lapisan riset berita untuk kandidat NEW BULLISH. AI tidak menentukan sinyal teknikal; halaman ini hanya menampilkan kandidat yang sudah lolos mesin teknikal.</div></section><div id="stats" class="grid"></div><div id="list"></div></div><script>
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function load(){let d;try{const r=await fetch('./data/signals.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();d=await r.json()}catch(e){document.getElementById('list').innerHTML='<div class="empty">Data signal belum tersedia.</div>';return}const q=(d.signals||[]).filter(x=>x.ai_candidate);document.getElementById('stats').innerHTML='<div class="stat"><div class="muted">Universe</div><div class="v">'+d.universe_count+'</div></div><div class="stat"><div class="muted">Signals</div><div class="v">'+d.signals_count+'</div></div><div class="stat"><div class="muted">NEW BULLISH</div><div class="v">'+d.new_bullish_count+'</div></div><div class="stat"><div class="muted">AI Queue</div><div class="v">'+d.ai_queue_count+'</div></div>';if(!q.length){document.getElementById('list').innerHTML='<div class="empty"><b>Belum ada kandidat AI.</b><p class="muted">Normal pada initial snapshot. Queue muncul ketika saham berpindah ke Bullish atau skor Bullish meningkat ≥15 poin dan memenuhi ambang AI.</p></div>';return}document.getElementById('list').innerHTML=q.map(x=>'<article class="card"><div class="row"><div><div class="ticker">'+esc(x.ticker)+'</div><div class="muted">'+esc(x.name)+'</div></div><span class="badge">AI RESEARCH QUEUE</span></div><p class="note">Signal <b>'+esc(x.signal)+'</b> · Score <b>'+x.score+'</b> · Konfluensi <b>'+x.agree+'/'+x.total+'</b> · RSI '+x.rsi+' · Stoch '+x.stoch_k+'/'+x.stoch_d+' · MACD Hist '+x.macd_hist_pct+'% · RVOL '+x.rvol+'x.</p><p class="muted">As-of: '+esc(x.asof)+' · Perubahan score: '+x.score_delta+'</p><p class="note">Status riset: <b>QUEUE</b>. News, catalyst, dan risk belum diisi oleh AI research layer.</p></article>').join('')}load();</script></body></html>
